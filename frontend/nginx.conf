# nginx.conf — Nginx configuration for React SPA

server {
    listen 80;
    server_name _;

    # Root directory where the built React app lives
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — this is the key configuration for React Router
    # Without this, refreshing /projects would return 404
    # because Nginx looks for a file called "projects" which doesn't exist
    # try_files: first try the exact file, then the exact directory,
    # if neither exists — serve index.html and let React Router handle it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    # /api/* → http://backend:4000/api/*
    # "backend" is the Docker Compose service name
    location /api {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets aggressively
    # JS/CSS files have hashed names so they can be cached forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}