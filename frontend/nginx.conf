# nginx.conf — Nginx configuration for React SPA
# BACKEND_HOST is replaced at build time by Dockerfile sed command
# Docker Compose: backend
# Kubernetes:     devops-platform-backend

server {
    listen 80;
    server_name _;

    # Root directory where the built React app lives
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — required for React Router
    # Without this, refreshing /projects returns 404
    # try_files: look for exact file, then directory, then serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    # BACKEND_HOST is replaced at build time
    location /api {
        proxy_pass http://BACKEND_HOST:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy health check to backend
    location /health {
        proxy_pass http://BACKEND_HOST:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Cache static assets aggressively
    # JS/CSS files have hashed names so they can be cached forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}