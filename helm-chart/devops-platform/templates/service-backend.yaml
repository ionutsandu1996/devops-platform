# service-backend.yaml — Exposes the backend API inside the cluster
# ClusterIP = only accessible within the cluster
# Ingress routes /api/* traffic to this service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-platform.fullname" . }}-backend
  labels:
    {{- include "devops-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "devops-platform.backendLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
      protocol: TCP
      name: http