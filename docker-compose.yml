services:

  postgres:
    image: postgres:15-alpine
    container_name: devops-website-db
    environment:
      POSTGRES_DB:       devops_website
      POSTGRES_USER:     devops_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d devops_website"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops-website-backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV:       development
      DB_HOST:        postgres
      DB_PORT:        5432
      DB_NAME:        devops_website
      DB_USER:        devops_user
      DB_PASSWORD:    ${DB_PASSWORD}
      JWT_SECRET:     ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM:    ${RESEND_FROM}
      ADMIN_EMAIL:    ${ADMIN_EMAIL}
      PORT:           4000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        BACKEND_HOST: backend
    container_name: devops-website-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: