# build-backend.yml — CI/CD workflow for the backend service
# Triggered on push to main when files in backend/ change

name: Build and Push Backend

on:
  push:
    branches:
      - main
    paths:
      # Only trigger when backend files change
      # Ignoring this file itself to avoid infinite loops
      - 'backend/**'
      - '!backend/**/*.md'

env:
  # GitHub Container Registry URL
  REGISTRY: ghcr.io
  # Image name — must be lowercase
  IMAGE_NAME: ghcr.io/ionutsandu1996/devops-platform-backend

jobs:
  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    steps:

      # Step 1 — Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Extract version from package.json
      # We use this as the image tag (e.g. 1.0.0)
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./backend/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      # Step 3 — Login to GitHub Container Registry
      # Uses the GHCR_TOKEN secret we added in GitHub
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Step 4 — Setup Docker Buildx
      # Buildx allows multi-platform builds (amd64 + arm64)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5 — Build and push the Docker image
      # Tags: latest + semantic version (e.g. 1.0.0)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          dockerfile: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          # Cache layers between builds — speeds up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 6 — Print summary
      - name: Print image details
        run: |
          echo "✅ Backend image pushed successfully!"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}"