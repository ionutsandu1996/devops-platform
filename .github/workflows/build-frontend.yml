name: Build and Push Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ionutsandu1996/devops-platform-frontend

jobs:
  build-and-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version:    ${{ steps.version.outputs.VERSION }}
      image:      ${{ steps.meta.outputs.IMAGE }}
      dockerfile: ${{ steps.meta.outputs.DOCKERFILE }}
      context:    ${{ steps.meta.outputs.CONTEXT }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bump version
        id: version
        run: |
          CURRENT="${{ vars.FRONTEND_VERSION }}"
          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Set build metadata
        id: meta
        run: |
          echo "IMAGE=${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "DOCKERFILE=./frontend/Dockerfile" >> $GITHUB_OUTPUT
          echo "CONTEXT=./frontend" >> $GITHUB_OUTPUT

      - name: Update FRONTEND_VERSION variable
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GHCR_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/FRONTEND_VERSION \
            -d "{\"name\":\"FRONTEND_VERSION\",\"value\":\"${{ steps.version.outputs.VERSION }}\"}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          dockerfile: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 2 — SUMMARY ──────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Print build summary
        run: |
          echo "╔══════════════════════════════════════════╗"
          echo "║         FRONTEND BUILD SUMMARY           ║"
          echo "╠══════════════════════════════════════════╣"
          echo "║ Version:    ${{ needs.build-and-push.outputs.version }}"
          echo "║ Image:      ${{ needs.build-and-push.outputs.image }}"
          echo "║ Dockerfile: ${{ needs.build-and-push.outputs.dockerfile }}"
          echo "║ Context:    ${{ needs.build-and-push.outputs.context }}"
          echo "║ Registry:   ghcr.io"
          echo "║ Commit:     ${{ github.sha }}"
          echo "║ Branch:     ${{ github.ref_name }}"
          echo "║ Triggered:  ${{ github.actor }}"
          echo "╚══════════════════════════════════════════╝"