name: Build and Push Frontend
run-name: Build and push frontend image
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '!frontend/**/*.md'

  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual build'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ionutsandu1996/devops-platform-frontend

jobs:
  build-and-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version:    ${{ steps.version.outputs.VERSION }}
      image:      ${{ steps.meta.outputs.IMAGE }}
      dockerfile: ${{ steps.meta.outputs.DOCKERFILE }}
      context:    ${{ steps.meta.outputs.CONTEXT }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bump version
        id: version
        run: |
          CURRENT="${{ vars.FRONTEND_VERSION }}"
          echo "Current version: $CURRENT"

          if [ -z "$CURRENT" ]; then
            echo "ERROR: FRONTEND_VERSION variable is empty!"
            exit 1
          fi

          MAJOR=$(echo $CURRENT | cut -d. -f1)
          MINOR=$(echo $CURRENT | cut -d. -f2)
          PATCH=$(echo $CURRENT | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          echo "New version: $NEW_VERSION"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Set build metadata
        id: meta
        run: |
          echo "IMAGE=${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}" >> $GITHUB_OUTPUT
          echo "DOCKERFILE=./frontend/Dockerfile" >> $GITHUB_OUTPUT
          echo "CONTEXT=./frontend" >> $GITHUB_OUTPUT

      - name: Update FRONTEND_VERSION variable
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GHCR_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/variables/FRONTEND_VERSION \
            -d "{\"name\":\"FRONTEND_VERSION\",\"value\":\"${{ steps.version.outputs.VERSION }}\"}"
          echo "✓ FRONTEND_VERSION updated to ${{ steps.version.outputs.VERSION }}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Print build summary
        run: |
          echo "## 🌐 Frontend Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${{ needs.build-and-push.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ needs.build-and-push.outputs.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Dockerfile** | \`${{ needs.build-and-push.outputs.dockerfile }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Context** | \`${{ needs.build-and-push.outputs.context }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`ghcr.io\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Image pushed to GHCR successfully!" >> $GITHUB_STEP_SUMMARY